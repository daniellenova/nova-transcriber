[project]
name = "nova-transcriber"
version = "0.1.0"
description = "nova-transcriber"
readme = "README.md"
authors = [
    { name = "Danielle Nova", email = "99331448+daniellenova@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "av==18.1.0",
    "ctranslate2==4.7.2",
    "faster-whisper>=1.2.1",
]

[project.scripts]
nova-transcriber = "nova_transcriber.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
