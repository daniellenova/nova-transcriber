services:
  transcriber:
    build: .
    entrypoint: ["/app/.venv/bin/python", "-m", "nova_transcriber.telegram"]
    restart: on-failure
    depends_on:
      - postgres
      - telegram-bot-api
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?Укажите POSTGRES_DB в .env}
      PGUSER: ${POSTGRES_USER:?Укажите POSTGRES_USER в .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB-100}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Europe/Moscow}
    volumes:
      - ./data:/data
      - ./models:/app/models:ro
      - telegram_data:/var/lib/telegram-bot-api:ro

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram_data:/var/lib/telegram-bot-api

  postgres:
    image: postgres:16-bookworm
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Укажите POSTGRES_DB в .env}
      POSTGRES_USER: ${POSTGRES_USER:?Укажите POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  telegram_data:
