services:
  core-api:
    build:
      context: .
      target: app
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: &database-environment
        PGHOST: postgres
        PGPORT: "5432"
        PGDATABASE: ${POSTGRES_DB:?Укажите POSTGRES_DB в .env}
        PGUSER: ${POSTGRES_USER:?Укажите POSTGRES_USER в .env}
        PGPASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}
      CORE_API_HOST: "0.0.0.0"
      CORE_API_TOKEN: ${CORE_API_TOKEN:-}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-}
      CORE_MEDIA_ROOT: /media
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB-1024}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS-43200}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Europe/Moscow}
    volumes:
      - ./data:/media:ro
      - telegram_data:/media/telegram:ro

  whisper-worker:
    build:
      context: .
      target: worker
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database-environment
      CORE_MEDIA_ROOT: /media
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB-1024}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS-43200}
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB-512}
      STAGE_TIMEOUT_SECONDS: ${STAGE_TIMEOUT_SECONDS-3600}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Europe/Moscow}
    volumes:
      - ./data:/media:ro
      - telegram_data:/media/telegram:ro
      - ./models:/app/models:ro

  telegram-adapter:
    build:
      context: .
      target: app
      args:
        COMPONENT_EXTRA: telegram
    container_name: nova-telegram-adapter
    entrypoint: ["/app/.venv/bin/python", "-m", "nova_transcriber.telegram"]
    restart: on-failure
    depends_on:
      - core-api
      - telegram-bot-api
    environment:
      CORE_API_URL: http://core-api:8000
      CORE_API_TOKEN: ${CORE_API_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB-1024}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS-43200}
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB-512}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Europe/Moscow}
    volumes:
      - telegram_data:/var/lib/telegram-bot-api:ro

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram_data:/var/lib/telegram-bot-api

  postgres:
    image: postgres:16-bookworm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Укажите POSTGRES_DB в .env}
      POSTGRES_USER: ${POSTGRES_USER:?Укажите POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  telegram_data:
